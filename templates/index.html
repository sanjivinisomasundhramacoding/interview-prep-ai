<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>InterviewPrep AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="app">

    <header>

        <div class="logo">
            🎤
        </div>

        <div>
            <h1>InterviewPrep AI</h1>
            <p>Your Personal AI Interview Assistant</p>
        </div>

    </header>


    <div class="quick-buttons">

        <button onclick="quickQuestion('Give me common HR interview questions for freshers')">
            👔 HR Questions
        </button>

        <button onclick="quickQuestion('Give me common Python interview questions with simple answers')">
            🐍 Python Interview
        </button>

        <button onclick="quickQuestion('Give me software testing interview questions for freshers')">
            🧪 Testing Interview
        </button>

        <button onclick="quickQuestion('How should I introduce myself in an interview as a fresher?')">
            🗣️ Self Introduction
        </button>

    </div>


    <main id="chatBox">

        <div class="message bot">

            <div class="avatar">
                🎤
            </div>

            <div class="bubble">

                <strong>InterviewPrep AI</strong>

                <p>
                    Hello! 👋 I'm InterviewPrep AI.
                    Ask me about HR questions, technical interviews,
                    coding, self introduction, resume-based questions
                    or mock interview preparation.
                </p>

            </div>

        </div>

    </main>


    <div class="input-area">

        <input
            type="text"
            id="messageInput"
            placeholder="Ask about interview preparation..."
            autocomplete="off"
        >

        <button id="sendButton" onclick="sendMessage()">
            Send ➤
        </button>

    </div>


    <footer>
        Powered by Gemini AI • InterviewPrep AI
    </footer>

</div>


<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
