<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CareerGuide AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="app">

    <header>

        <div class="logo">
            🎯
        </div>

        <div>
            <h1>CareerGuide AI</h1>
            <p>Your Personal AI Career Assistant</p>
        </div>

    </header>


    <div class="quick-buttons">

        <button onclick="quickQuestion('Which career is best for a Python beginner?')">
            🐍 Python Career
        </button>

        <button onclick="quickQuestion('Give me a roadmap to become a software tester')">
            🧪 Testing Roadmap
        </button>

        <button onclick="quickQuestion('What skills are required for AI and Data Science?')">
            🤖 AI & Data Science
        </button>

        <button onclick="quickQuestion('How can I improve my resume as a fresher?')">
            📄 Resume Tips
        </button>

    </div>


    <main id="chatBox">

        <div class="message bot">

            <div class="avatar">
                🎯
            </div>

            <div class="bubble">

                <strong>CareerGuide AI</strong>

                <p>
                    Hello! 👋 I'm CareerGuide AI.
                    Ask me about careers, skills, roadmaps,
                    resumes, jobs or interview preparation.
                </p>

            </div>

        </div>

    </main>


    <div class="input-area">

        <input
            type="text"
            id="messageInput"
            placeholder="Ask about your career..."
            autocomplete="off"
        >

        <button id="sendButton" onclick="sendMessage()">
            Send ➤
        </button>

    </div>


    <footer>
        Powered by Gemini AI • CareerGuide AI
    </footer>

</div>


<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
